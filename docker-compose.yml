services:
  postgres:
    image: postgres:15
    container_name: darbar-sweets-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: darbar_sweets_erp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in server/.env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d darbar_sweets_erp"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
