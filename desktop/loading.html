<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eastern Sweets</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f0e7;
        color: #123b39;
        font-family: Segoe UI, Arial, sans-serif;
      }
      .card {
        width: min(440px, calc(100vw - 32px));
        padding: 28px;
        border: 1px solid #ead8bb;
        border-radius: 20px;
        background: #fffaf0;
        text-align: center;
        box-shadow: 0 24px 70px rgba(31, 23, 10, 0.12);
      }
      img { width: 96px; height: 96px; object-fit: contain; }
      h1 { margin: 14px 0 8px; color: #0f615d; font-family: Georgia, serif; }
      p { margin: 0; color: #55716d; }
      .bar { overflow: hidden; height: 8px; margin-top: 22px; border-radius: 99px; background: #ead8bb; }
      .bar span {
        display: block;
        width: 45%;
        height: 100%;
        border-radius: inherit;
        background: #0f615d;
        animation: slide 1.1s ease-in-out infinite alternate;
      }
      @keyframes slide {
        from { transform: translateX(-30%); }
        to { transform: translateX(150%); }
      }
      #status { margin-top: 16px; font-size: 14px; font-weight: 600; color: #c88421; }
    </style>
  </head>
  <body>
    <section class="card">
      <img src="assets/icon.png" alt="Eastern Sweets" />
      <h1>Eastern Sweets</h1>
      <p>Starting desktop application...</p>
      <div class="bar"><span></span></div>
      <div id="status">Preparing...</div>
    </section>
    <script>
      window.electronAPI?.onStartupStatus?.((message) => {
        document.getElementById('status').textContent = message;
      });
    </script>
  </body>
</html>
